/* Layout: плотная одна колонка до 560px, сводки в строку, настройки в сворачиваемых секциях, нижняя навигация */
:root{
  --bg:#eef4f7; --surface:#ffffff; --surface2:#e6eef2; --fg:#13202b; --muted:#5a6872; --line:#dbe5ea;

  --carb:#a2468f;
  --shadow:0 2px 10px rgba(20,50,70,.07);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

  --accent:#5cc3ec; --accent-fg:#08202b; --accent-soft:#16303b;
  --ok:#3ccf9c; --ok-bg:#12372e; --lo:#f0a63a; --lo-bg:#3b2d12; --hi:#ff7f7f; --hi-bg:#401d22;

:root[data-theme="dark"]{

*{box-sizing:border-box}

.app>*{min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:34px}
h1{font-size:22px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
h2{font-size:12px;margin:10px 0 0;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}

.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:14px;font-weight:750}
.hero .big{font-size:46px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .unit{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.card .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.card textarea{background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:11px 12px;font-size:16px;line-height:1.4;min-height:84px}
.food-ai{background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.food-ai .btn.ghost{background:var(--surface);}
.food-ai-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.food-photo{position:relative;align-self:flex-start}
.food-photo img{display:block;max-width:100%;max-height:130px;border-radius:12px;object-fit:cover}
.food-photo .iconbtn{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:18px;line-height:1}
.food-xe{display:flex;align-items:baseline;gap:6px}
.food-xe .num{font-size:52px;line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--accent)}
.food-xe .unit{font-size:15px;font-weight:700;color:var(--muted)}
.mbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.mbar i{display:block;height:100%}
.mleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.mleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.mleg b{color:var(--fg)}
.fl{display:flex;flex-direction:column}
.fi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fi-n{min-width:0;flex:1}
.fi-n b{font-weight:650;overflow-wrap:anywhere}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.card .stp input[type=text]{width:54px;flex:none;text-align:center;padding:6px 2px;min-height:34px;border-radius:10px;background:var(--surface2);border:1px solid transparent;font-weight:700;font-size:15px}
.stp-b{width:32px;height:32px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);font-size:18px;font-weight:700;line-height:1;padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--surface);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.tile .v small{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0}

.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:15px;padding:11px 14px;min-height:44px;width:100%;text-align:center;text-decoration:none;display:block}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--hi-bg);color:var(--hi)}
.btn.sm{width:auto;min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px;display:inline-block}
.btn:active{transform:scale(.98)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--surface2);color:var(--fg);border-radius:10px;padding:7px 12px;font-weight:650;font-size:13px;min-height:34px}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.in{background:var(--ok-bg);color:var(--ok)}
.pill.low{background:var(--lo-bg);color:var(--lo)}
.pill.high{background:var(--hi-bg);color:var(--hi)}
.pill.none{background:var(--surface2);color:var(--muted)}

label.l,.l{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=email],input[type=tel],input[type=time],input[type=datetime-local],select,textarea{
  width:100%;border:2px solid transparent;background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:16px;outline:0;min-height:44px;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
input.hug{font-size:28px;font-weight:800;min-height:56px;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;min-width:0}
.err{background:var(--hi-bg);color:var(--hi);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.note-box{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.warn-box{background:var(--lo-bg);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}

.day{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 2px -2px}
.day b{font-size:13px}
.rec{display:grid;grid-template-columns:8px 42px 46px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.rec .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);align-self:center}
.rec .dot.in{background:var(--ok)}.rec .dot.low{background:var(--lo)}.rec .dot.high{background:var(--hi)}
.rec .tm{font-size:12px;color:var(--muted)}
.rec .g{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.rec .x{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rec .x b{color:var(--fg);font-weight:650}
.rec .n{grid-column:4;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:5px}

.tir{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.tir i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{color:var(--fg)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font:10.5px var(--font);font-variant-numeric:tabular-nums}
svg.chart .grid{stroke:var(--line);stroke-width:1}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:0 0 4px;font-weight:700}
table.t td{padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t th:not(:first-child),table.t td:not(:first-child){text-align:right}
.empty{text-align:center;color:var(--muted);padding:22px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty-sm{color:var(--muted);padding:12px 0;text-align:center;font-size:13px}

details.card{padding:0;gap:0}
details.card>summary{list-style:none;padding:13px 14px;font-weight:750;font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:46px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:3px;transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.tog{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--surface2);flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(18px);background:var(--accent-fg)}
.iconbtn{border:0;background:var(--surface2);border-radius:10px;width:36px;height:36px;color:var(--muted);flex:none;display:grid;place-items:center}
.iconbtn svg{width:17px;height:17px}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:4}
.nav .bar{pointer-events:auto;width:100%;max-width:540px;background:var(--surface);border-radius:20px;box-shadow:0 4px 22px rgba(20,24,70,.2);display:grid;grid-template-columns:repeat(6,1fr);padding:4px;border:1px solid var(--line)}
.nav button{border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:15px;min-width:0}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--accent)}
.nav button.add{background:var(--accent);color:var(--accent-fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);z-index:9;box-shadow:var(--shadow);text-align:center}
.banner{background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner .btn{background:var(--accent-fg);color:var(--accent)}

.lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.lock h2{margin:0;font-size:18px;text-transform:none;letter-spacing:0;color:var(--fg)}
.dots{display:flex;gap:14px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:12px}
.pad button{height:62px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:24px;font-weight:700}
.pad button.ghost{background:none;box-shadow:none;font-size:14px;color:var(--muted)}
details.xtra{background:var(--surface2);border-radius:12px}
details.xtra>summary{list-style:none;padding:10px 12px;font-weight:700;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);min-height:42px}
details.xtra>summary::-webkit-details-marker{display:none}
details.xtra>summary::after{content:"+";font-size:20px;line-height:1}
details.xtra[open]>summary::after{content:"−"}
details.xtra>.in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
details.xtra input{background:var(--surface)}
details.xtra .chip{background:var(--surface)}
details.xtra .chip.on{background:var(--accent);color:var(--accent-fg)}
/* ===== спокойное оформление: плоские поверхности, тонкие границы, один акцентный цвет ===== */
body{background:var(--bg)}
.app{gap:12px;padding:16px 16px 100px}
.head{align-items:center}
h1{font-size:26px;letter-spacing:-.025em;font-weight:700}
.sub{font-size:13.5px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);box-shadow:none}
.logo svg{width:20px;height:20px}
h2{font-size:12px;letter-spacing:.08em;margin:14px 4px 0;font-weight:650}
.card{border-radius:16px;padding:16px;box-shadow:none;border:1px solid var(--line)}
.card h3{font-size:15px}
.hero .big{font-size:54px;letter-spacing:-.04em;font-weight:700}
.btn{border-radius:12px;background:var(--accent);box-shadow:none;min-height:48px;font-size:15px;font-weight:650}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--hi-bg);color:var(--hi)}
.btn.sm{border-radius:10px;min-height:38px}
.btn:disabled{opacity:.55}
.chip{border-radius:10px;padding:8px 14px;background:var(--surface);border:1px solid var(--line);min-height:38px;font-weight:600}
.chip.on,details.xtra .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
details.xtra .chip{background:var(--surface)}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=email],input[type=tel],input[type=time],input[type=datetime-local],select,textarea,.card textarea{border-radius:12px;min-height:46px;background:var(--surface2);border:1px solid var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:none}
input.hug{border-radius:12px}
.tile{border-radius:14px;padding:12px 10px;box-shadow:none;border:1px solid var(--line)}
.tile .k{font-size:10px;letter-spacing:.03em}
.tile .v{font-size:20px}
.rec{border-radius:14px;padding:12px 14px;box-shadow:none;border:1px solid var(--line)}
.rec .g{font-size:18px}
.tir,.mbar{height:10px}
.err,.note-box,.warn-box{border-radius:12px;padding:12px 14px}
.banner{background:var(--accent);border-radius:14px}
.food-ai{border-radius:14px;padding:12px}
.stp-b{background:var(--surface2);color:var(--fg)}
.tog{width:48px;height:28px}
.tog::after{width:22px;height:22px;top:3px;left:3px}
.tog.on::after{transform:translateX(20px)}
.iconbtn{border-radius:10px}
details.card>summary{gap:12px;justify-content:flex-start;padding:14px 16px;min-height:60px;font-size:15px}
details.card>summary .st{flex:1;min-width:0}
details.card>summary::after{margin-left:auto}
details.card>.in{padding:2px 16px 16px}
.si{width:36px;height:36px;border-radius:10px;background:var(--surface2);color:var(--accent);display:grid;place-items:center;flex:none}
.si svg{width:19px;height:19px}
details.xtra{border-radius:12px}
.pal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pk{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 0 6px;border-radius:12px}
.pk i{width:36px;height:36px;border-radius:50%;position:relative}
.pk.on{color:var(--fg);background:var(--surface2)}
.pk.on i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--fg)}
.hue{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;border:0;padding:0;min-height:12px;background:linear-gradient(90deg,hsl(0 55% 50%),hsl(60 55% 45%),hsl(120 45% 42%),hsl(180 55% 40%),hsl(240 50% 55%),hsl(300 45% 50%),hsl(360 55% 50%))}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--fg)}
.hue::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--fg)}
.nav{padding:0;left:0;right:0}
.nav .bar{max-width:none;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);align-items:center;overflow:visible}
.nav button{border-radius:12px;padding:6px 0 4px;color:var(--muted)}
.nav button.on{color:var(--accent);background:none}
.nav button.add{background:var(--accent);color:var(--accent-fg);width:auto;height:auto;border-radius:12px;margin:0 6px;padding:6px 0 4px;font-size:10.5px;gap:2px;box-shadow:none;border:0}
.nav button.add svg{width:21px;height:21px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));border-radius:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* ===== DiaCare 3.0: новая структура ===== */
.app{padding:20px 16px 150px;gap:14px}
.head{align-items:flex-end;min-height:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:3px}
h1{font-size:32px;font-weight:750;letter-spacing:-.035em;line-height:1.05}
h2{margin:8px 6px -4px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:700;color:var(--muted)}
.card{border:0;border-radius:26px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -14px rgba(0,0,0,.18);gap:14px}
.btn,.btn.sm{border-radius:999px;border:0}
.btn{min-height:54px;font-size:16px;font-weight:700}
.btn.sm{min-height:40px}
.chip{border-radius:999px;border:0;background:var(--surface2);min-height:40px;padding:8px 16px}
.chip.on,details.xtra .chip.on{background:var(--accent);color:var(--accent-fg)}
.seg{display:flex;gap:2px;background:var(--surface2);border-radius:999px;padding:4px}
.app>.seg{background:var(--surface)}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.sg{flex:1;border:0;background:none;border-radius:999px;padding:9px 14px;font-weight:650;font-size:13.5px;color:var(--muted);white-space:nowrap;min-height:40px}
.sg.on{background:var(--accent);color:var(--accent-fg)}
.banner,.warn-box,.note-box{border-radius:20px}
/* Сегодня */
.hero3{gap:16px}
.hero3 .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero3 .lab{font-size:13px;color:var(--muted);font-weight:600}
.hero3 .val{display:flex;align-items:baseline;gap:8px}
.hero3 .val b{font-size:68px;line-height:.95;font-weight:750;letter-spacing:-.045em}
.hero3 .unit{font-size:15px;font-weight:650;color:var(--muted)}
.gauge{position:relative;height:10px;border-radius:99px;background:var(--surface2);margin-top:4px}
.gauge .gz{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.32;border-radius:99px}
.gauge i{position:absolute;top:-5px;width:6px;height:20px;border-radius:4px;background:var(--fg);transform:translateX(-50%)}
.gnote{font-size:12px;color:var(--muted);margin-top:-6px}
.qe{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:999px;padding:5px 5px 5px 20px}
.qe input[type=text]{flex:1;min-width:0;background:none;border:0;min-height:42px;padding:0;border-radius:0;font-size:16px}
.qe .btn{width:auto;flex:none;min-height:44px;padding:0 20px;font-size:15px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -16px rgba(0,0,0,.2)}
.mt .k{font-size:12.5px;color:var(--muted);font-weight:600}
.mt .v{font-size:28px;font-weight:750;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.mt .v small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
/* список записей */
.list{background:var(--surface);border-radius:26px;padding:4px 0;gap:0;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -16px rgba(0,0,0,.2);overflow:hidden}
.rec{display:flex;align-items:center;gap:14px;border-radius:0;border:0;background:none;box-shadow:none;padding:12px 16px;width:100%;text-align:left}
.rec+.rec{border-top:1px solid var(--line)}
.gb{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-weight:750;font-size:18px;background:var(--surface2);color:var(--fg);font-variant-numeric:tabular-nums}
.gb.in{background:var(--ok-bg);color:var(--ok)}.gb.low{background:var(--lo-bg);color:var(--lo)}.gb.high{background:var(--hi-bg);color:var(--hi)}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r1{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:15px}
.r1 em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px}
.r2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.r2 b{color:var(--fg);font-weight:650}
.r3{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.day{margin:8px 6px -6px}.day b{font-size:14px}
/* нижняя панель */
.nav{padding:0 0 calc(12px + env(safe-area-inset-bottom,0px))}
.nav .bar{max-width:560px;width:100%;background:none;border:0;box-shadow:none;border-radius:0;padding:0 14px;display:flex;align-items:center;gap:10px;overflow:visible}
.dock{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:999px;padding:6px;box-shadow:0 12px 30px -8px rgba(0,0,0,.3),0 0 0 1px var(--line)}
.dock button{flex:none;flex-direction:row;gap:5px;border-radius:999px;padding:0 10px;height:46px;color:var(--muted);font-size:12.5px;font-weight:700;align-items:center}
.dock button svg{width:22px;height:22px}
.dock button.on{background:var(--accent);color:var(--accent-fg);padding:0 14px}
.dock .nl{display:none}.dock button.on .nl{display:inline}
.nav .fab{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 12px 26px -6px rgba(0,0,0,.45)}
.nav .fab svg{width:28px;height:28px}
/* форма записи */
.sugar{align-items:center;text-align:center;gap:12px}
.sugar .lbl{font-size:13px;font-weight:650;color:var(--muted)}
.sugar .r3b{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.rnd{width:52px;height:52px;border-radius:50%;border:0;background:var(--surface2);font-size:26px;font-weight:500;flex:none;line-height:1;color:var(--fg)}
.rnd.s{width:38px;height:38px;font-size:22px}
.sugar input.hug[type=text]{width:150px;min-height:78px;font-size:58px;text-align:center;background:none;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0;letter-spacing:-.04em}
.sugar input.hug[type=text]:focus{border-bottom-color:var(--accent)}
.sugar .u{font-size:14px;font-weight:650;color:var(--muted)}
.sugar .chips{justify-content:center}
.when{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface2);border-radius:999px;padding:4px 6px 4px 16px;font-size:13px;font-weight:650;color:var(--muted)}
.when input[type=datetime-local]{width:auto;min-height:38px;background:none;border:0;font-size:14px;font-weight:650;color:var(--fg);padding:0 8px}
.grp{background:var(--surface);border-radius:26px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -16px rgba(0,0,0,.2)}
.frow{display:flex;align-items:center;gap:10px;padding:10px 16px;width:100%;border:0;background:none;text-align:left;min-height:62px}
.frow+.frow{border-top:1px solid var(--line)}
.frow .fl{flex:1;min-width:0;font-weight:650;font-size:15px}
.frow .fl small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.frow .stp2{display:flex;align-items:center;gap:6px}
.frow input[type=text]{width:62px;min-height:40px;text-align:center;border-radius:14px;font-weight:700;font-size:16px;padding:0 4px}
.frow.lnk{color:var(--accent);font-weight:700;font-size:15px}
.frow.lnk::after,.mrow::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-left:auto}
.frow.lnk span{flex:1}
.savebar{position:sticky;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:3}
.savebar .btn{box-shadow:0 12px 26px -8px rgba(0,0,0,.4)}
/* Ещё */
.prof3{flex-direction:row;align-items:center;gap:14px}
.av{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:24px;font-weight:750;flex:none}
.prof3 b{font-size:18px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:13px 16px;text-align:left;font-size:16px;font-weight:650;min-height:64px}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .st{flex:1;min-width:0}
.mrow::after{margin-left:0}
.mrow .si{width:40px;height:40px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.back{border:0;background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;color:var(--accent);flex:none}
.strip{grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:22px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -16px rgba(0,0,0,.2)}
.tile .k{font-size:12px;text-transform:none;letter-spacing:0;font-weight:600}
.tile .v{font-size:28px}
details.card>summary{padding:16px 18px}
details.card>.in{padding:2px 18px 18px}
.vtag{font-size:12px;color:var(--muted);text-align:center}
@media (min-width:700px){.app{padding-top:28px}}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div id="toast" class="toast" hidden></div>
<nav class="nav" aria-label="Разделы"><div class="bar" id="nav"></div></nav>
<div id="lock" class="lock" hidden></div>

<script>
(function(){
"use strict";
var KEY="diacare_v2", MG=18.016, DAY=864e5;
var storageOk=true;

/* ---------- данные ---------- */
function defaults(){return {records:[],settings:{name:"",unit:"mmol",low:3.9,high:10,theme:"auto",email:"",reminders:[],carbUnit:"g",xeG:12,accent:"green",hue:200,pin:"",ecName:"",ecPhone:"",plan:"",card:"",supplies:[],oneoff:[],aiProv:"gemini",aiKey:"",aiModel:"",foods:[]}}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function load(){
  var db=defaults();
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.records)){db.records=p.records;db.settings=Object.assign(db.settings,p.settings||{})}return db}
    var old=localStorage.getItem("diacare_records");
    if(old){var arr=JSON.parse(old);if(Array.isArray(arr)){db.records=arr.map(function(r){return{id:uid(),t:new Date(r.d).getTime(),g:r.g,ins:r.i,insL:null,c:r.c,meal:r.m||"",note:r.n||""}}).filter(function(r){return isFinite(r.t)})}}
  }catch(e){storageOk=false}
  return db;
}
var db=load();
function migrate(a){var ch=false;a.forEach(function(r){if(r.insType==="long"&&r.ins!=null&&r.insL==null){r.insL=r.ins;r.ins=null;ch=true}if("insType" in r){delete r.insType;ch=true}});return ch}
if(migrate(db.records))try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOk=true}catch(e){storageOk=false}}
function exportDb(){var s=Object.assign({},db.settings);delete s.pin;delete s.aiKey;return JSON.stringify({records:db.records,settings:s})}

/* ---------- утилиты ---------- */
var $app=document.getElementById("app"),$nav=document.getElementById("nav"),$toast=document.getElementById("toast"),$lock=document.getElementById("lock");
var S={notif:"",exact:"",nativeOk:true,tab:"today",histDays:0,chartDays:14,repDays:14,barKind:"ins",confirm:null,alerts:[],importMsg:"",form:null,setErr:"",repMsg:"",open:{},sub:null};
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function pad(n){return String(n).padStart(2,"0")}
function dayKey(t){var d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function timeStr(t){var d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
function localInput(t){return dayKey(t)+"T"+timeStr(t)}
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"],WD=["вс","пн","вт","ср","чт","пт","сб"];
function dShort(t){var d=new Date(t);return d.getDate()+" "+MON[d.getMonth()]}
function dayTitle(k){
  var p=k.split("-").map(Number),dt=new Date(p[0],p[1]-1,p[2]);
  if(k===dayKey(Date.now()))return "Сегодня";
  if(k===dayKey(Date.now()-DAY))return "Вчера";
  return p[2]+" "+MON[p[1]-1]+", "+WD[dt.getDay()];
}
function num(n){return Number.isInteger(n)?String(n):(Math.round(n*10)/10).toFixed(1)}
function parseNum(v){var n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null}
function toast(msg){$toast.textContent=msg;$toast.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){$toast.hidden=true},2800)}
function isNative(){try{return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}catch(e){return false}}
function plug(n){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n]}
/* вызов плагина телефона: напрямую или через мост Capacitor (так работает без сборщика) */
function nat(p,m,o){
  try{
    var C=window.Capacitor;if(!C||!isNative())return Promise.reject(new Error("no native"));
    var P=C.Plugins&&C.Plugins[p];if(P&&typeof P[m]==="function")return P[m](o||{});
    if(typeof C.nativePromise==="function")return C.nativePromise(p,m,o||{});
  }catch(e){return Promise.reject(e)}
  return Promise.reject(new Error("no native"));
}
var CH="diacare-reminders",audioCtx=null;
function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=audioCtx||new AC();if(audioCtx.state==="suspended")audioCtx.resume();
    [0,0.35,0.7].forEach(function(d){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(0.0001,audioCtx.currentTime+d);g.gain.exponentialRampToValueAtTime(0.4,audioCtx.currentTime+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d+0.28);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+0.3)});
  }catch(e){}
}
document.addEventListener("click",function(){try{var AC=window.AudioContext||window.webkitAudioContext;if(AC&&!audioCtx)audioCtx=new AC();if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume()}catch(e){}},true);

/* сахар: в памяти всегда ммоль/л */
function isMg(){return db.settings.unit==="mgdl"}
function dnum(g){return isMg()?Math.round(g*MG):Math.round(g*10)/10}
function dstr(g){return isMg()?String(Math.round(g*MG)):(Math.round(g*10)/10).toFixed(1)}
function unitLbl(){return isMg()?"мг/дл":"ммоль/л"}
function toMmol(v){return isMg()?Math.round(v/MG*100)/100:Math.round(v*100)/100}
function status(g){return g<db.settings.low?"low":g>db.settings.high?"high":"in"}
var STL={low:"Ниже цели",in:"В цели",high:"Выше цели"};
var INS={rapid:"короткий",long:"длинный"};
var TAGS=["Спорт","Болезнь","Стресс","Алкоголь"],SITES=["Живот лев.","Живот прав.","Бедро лев.","Бедро прав.","Плечо лев.","Плечо прав."];
function extraBits(r){var b=[];if(r.act!=null)b.push("актив. "+num(r.act)+" мин");if(r.wt!=null)b.push("вес "+num(r.wt));if(r.bp)b.push("АД "+r.bp);if(r.ket!=null)b.push("кетоны "+num(r.ket));if(r.a1c!=null)b.push("HbA1c "+num(r.a1c)+"%");if(r.site)b.push("укол: "+r.site);if(r.tags&&r.tags.length)b.push(r.tags.map(function(t){return"#"+t}).join(" "));return b}
function lowSupplies(){return(db.settings.supplies||[]).filter(function(x){return x.n<=x.w})}
/* углеводы: в памяти граммы, показ в граммах или ХЕ */
function xeMode(){return db.settings.carbUnit==="xe"}
function cScale(){return xeMode()?1/db.settings.xeG:1}
function cd(c){return xeMode()?num(Math.round(c/db.settings.xeG*10)/10):String(Math.round(c))}
function cu(){return xeMode()?"ХЕ":"г"}
function cToG(v){return xeMode()?Math.round(v*db.settings.xeG*10)/10:v}
/* оценка HbA1c по среднему (GMI) */
function gmi(avgMmol){return 3.31+0.02392*avgMmol*MG}

function inPeriod(days){var now=Date.now(),from=now-days*DAY;return db.records.filter(function(r){return r.t>=from&&r.t<=now+3600e3}).sort(function(a,b){return a.t-b.t})}
function stats(rs){
  var gs=rs.filter(function(r){return r.g!=null}).map(function(r){return r.g}),n=gs.length,o={n:n};
  if(n){o.avg=gs.reduce(function(a,b){return a+b},0)/n;o.min=Math.min.apply(0,gs);o.max=Math.max.apply(0,gs);
    var lo=gs.filter(function(g){return g<db.settings.low}).length,hi=gs.filter(function(g){return g>db.settings.high}).length;
    o.low=lo/n*100;o.high=hi/n*100;o.inr=100-o.low-o.high}
  var days={};rs.forEach(function(r){days[dayKey(r.t)]=1});o.days=Object.keys(days).length;
  o.ins=rs.reduce(function(a,r){return a+(r.ins||0)},0);o.insL=rs.reduce(function(a,r){return a+(r.insL||0)},0);o.carbs=rs.reduce(function(a,r){return a+(r.c||0)},0);
  return o;
}
var PERIODS=[["Ночь","00–06",0,6],["Утро","06–12",6,12],["День","12–18",12,18],["Вечер","18–24",18,24]];
function periodStats(rs){
  return PERIODS.map(function(p){
    var gs=rs.filter(function(r){var h=new Date(r.t).getHours();return r.g!=null&&h>=p[2]&&h<p[3]}).map(function(r){return r.g});
    var n=gs.length,avg=n?gs.reduce(function(a,b){return a+b},0)/n:null,inr=n?gs.filter(function(g){return g>=db.settings.low&&g<=db.settings.high}).length/n*100:null;
    return{name:p[0],range:p[1],n:n,avg:avg,inr:inr};
  });
}

function hx(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;var a=s*Math.min(l,1-l),f=function(n){var k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,"0")};return"#"+f(0)+f(8)+f(4)}
function mk(n,h,o){o=o||{};var s=o.s==null?50:o.s,al=o.l||38,bs=o.bs==null?12:o.bs,ds=Math.max(25,s-8);
  var L={bg:hx(h,bs,96),surface:"#ffffff",surface2:hx(h,bs,94),fg:hx(h,25,12),muted:hx(h,8,42),line:hx(h,bs,88),accent:hx(h,s,al),accentFg:"#ffffff",accentSoft:hx(h,Math.max(bs,s-5),94),carb:hx(h+150,35,40)};
  var D={bg:hx(h,bs,8),surface:hx(h,bs,11.5),surface2:hx(h,bs,15),fg:hx(h,15,93),muted:hx(h,8,65),line:hx(h,bs,20),accent:hx(h,ds,68),accentFg:hx(h,40,9),accentSoft:hx(h,Math.max(bs,ds-15),18),carb:hx(h+150,45,70)};
  L.accent2=L.accent;D.accent2=D.accent;return{n:n,L:L,D:D};
}
var PRESETS={green:mk("Зелёный",152,{s:42,l:30}),teal:mk("Бирюзовый",186,{s:55,l:30}),blue:mk("Синий",216,{s:55,l:42}),violet:mk("Фиолетовый",256,{s:40,l:46}),plum:mk("Сливовый",322,{s:35,l:40}),clay:mk("Терракот",14,{s:50,l:44}),sand:mk("Песочный",38,{s:60,l:34}),graphite:mk("Графит",220,{s:10,l:30,bs:6})};
function ensureCustom(){var h=db.settings.hue;h=(h==null?200:+h);PRESETS.custom=mk("Свой",h,{s:45,l:(h>50&&h<190)?30:42})}
function accentKey(){if(db.settings.accent==="custom"){ensureCustom();return"custom"}return PRESETS[db.settings.accent]?db.settings.accent:"green"}
function applyAccent(){
  var P=PRESETS[accentKey()];
  function css(o){return"--bg:"+o.bg+";--surface:"+o.surface+";--surface2:"+o.surface2+";--fg:"+o.fg+";--muted:"+o.muted+";--line:"+o.line+";--accent:"+o.accent+";--accent-fg:"+o.accentFg+";--accent-soft:"+o.accentSoft+";--accent2:"+o.accent2+";--carb:"+o.carb+";"}
  var el=document.getElementById("acc-style");
  if(!el){el=document.createElement("style");el.id="acc-style";document.head.appendChild(el)}
  el.textContent=":root{"+css(P.L)+"}@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){"+css(P.D)+"}}:root[data-theme=\"dark\"]{"+css(P.D)+"}";
}

/* ---------- иконки ---------- */
function ic(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var ICONS={
  today:ic('<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  add:ic('<path d="M12 5v14M5 12h14"/>'),
  history:ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  charts:ic('<path d="M3 17l6-6 4 4 8-9"/><path d="M3 21h18"/>'),
  more:ic('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  food:ic('<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2.2 2-3 5-3 8h3v10"/>'),
  trash:ic('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  drop:ic('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>')
};
var TABS=[["today","Сегодня"],["history","История"],["add","Запись"],["food","Еда"],["charts","Графики"],["more","Ещё"]];
function renderNav(){
  var tabs=TABS.filter(function(t){return t[0]!=="add"});
  $nav.innerHTML='<div class="dock">'+tabs.map(function(t){var on=S.tab===t[0];return '<button type="button" data-act="tab" data-v="'+t[0]+'" class="'+(on?"on":"")+'" aria-label="'+t[1]+'"'+(on?' aria-current="page"':"")+'>'+ICONS[t[0]]+'<span class="nl">'+t[1]+'</span></button>'}).join("")+'</div>'+(S.tab==="add"?'':'<button type="button" class="fab" data-act="tab" data-v="add" aria-label="Новая запись">'+ICONS.add+'</button>');
}

/* ---------- формы ---------- */
function newForm(){return{id:null,time:localInput(Date.now()),g:"",ins:"",insL:"",c:"",pr:"",ft:"",meal:"",note:"",act:"",wt:"",bp:"",ket:"",a1c:"",site:"",tags:[],remind:0,err:""}}
function formFrom(r){return{id:r.id,time:localInput(r.t),g:r.g!=null?dstr(r.g):"",ins:r.ins!=null?String(r.ins):"",insL:r.insL!=null?String(r.insL):"",c:r.c!=null?cd(r.c):"",pr:r.pr!=null?String(r.pr):"",ft:r.ft!=null?String(r.ft):"",meal:r.meal||"",note:r.note||"",act:r.act!=null?String(r.act):"",wt:r.wt!=null?String(r.wt):"",bp:r.bp||"",ket:r.ket!=null?String(r.ket):"",a1c:r.a1c!=null?String(r.a1c):"",site:r.site||"",tags:(r.tags||[]).slice(),remind:0,err:""}}
function glucoseErr(g){var gl=isMg()?[18,720]:[1,40];return(g<gl[0]||g>gl[1])?"Сахар должен быть от "+gl[0]+" до "+gl[1]+" "+unitLbl()+". Проверьте значение.":""}
function saveForm(){
  var f=S.form,t=new Date(f.time).getTime();
  if(!isFinite(t)){f.err="Укажите дату и время.";return false}
  var g=f.g.trim()?parseNum(f.g):null,ins=f.ins.trim()?parseNum(f.ins):null,insL=f.insL.trim()?parseNum(f.insL):null,c=f.c.trim()?parseNum(f.c):null;
  if((f.g.trim()&&g==null)||(f.ins.trim()&&ins==null)||(f.insL.trim()&&insL==null)||(f.c.trim()&&c==null)){f.err="Введите числа цифрами, например 7.2.";return false}
  var act=f.act.trim()?parseNum(f.act):null,wt=f.wt.trim()?parseNum(f.wt):null,ket=f.ket.trim()?parseNum(f.ket):null,a1c=f.a1c.trim()?parseNum(f.a1c):null,bp=f.bp.trim();
  if((f.act.trim()&&act==null)||(f.wt.trim()&&wt==null)||(f.ket.trim()&&ket==null)||(f.a1c.trim()&&a1c==null)){f.err="В дополнительных полях введите числа цифрами.";return false}
  var pr=f.pr.trim()?parseNum(f.pr):null,ft=f.ft.trim()?parseNum(f.ft):null;

/* ---------- PIN ---------- */
var L={mode:"unlock",buf:"",first:"",msg:"",forgot:false},hiddenAt=0;
function hashPin(p){var h1=0xdeadbeef,h2=0x41c6ce57,i,c;p="dc-"+p;for(i=0;i<p.length;i++){c=p.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return String(4294967296*(2097151&h2)+(h1>>>0))}
function showLock(mode,msg){L={mode:mode,buf:"",first:"",msg:msg||"",forgot:false};renderLock();$lock.hidden=false}
function hideLock(){$lock.hidden=true;$lock.innerHTML=""}
function renderLock(){
  var title={unlock:"Введите PIN-код",set1:"Придумайте PIN-код",set2:"Повторите PIN-код",off:"Введите PIN-код, чтобы отключить"}[L.mode];
  var d="";for(var i=0;i<4;i++)d+='<i class="'+(i<L.buf.length?"f":"")+'"></i>';
  var keys="";[1,2,3,4,5,6,7,8,9].forEach(function(k){keys+='<button type="button" data-k="'+k+'" aria-label="'+k+'">'+k+'</button>'});
  keys+='<button type="button" class="ghost" data-k="x" aria-label="Отмена">'+(L.mode==="unlock"?"":"Отмена")+'</button><button type="button" data-k="0" aria-label="0">0</button><button type="button" class="ghost" data-k="b" aria-label="Стереть">⌫</button>';
  var h='<div class="logo" style="width:44px;height:44px;border-radius:14px">'+ICONS.drop+'</div><h2>'+title+'</h2><div class="dots" aria-hidden="true">'+d+'</div><div class="small" style="min-height:18px;color:var(--hi)" role="alert">'+esc(L.msg)+'</div><div class="pad">'+keys+'</div>';
  if(L.mode==="unlock"){
    h+=L.forgot?'<div class="warn-box" style="max-width:300px"><div>Если сбросить PIN, все записи на этом устройстве будут удалены. Восстановить их можно только из резервной копии.</div><button type="button" class="btn danger sm" data-k="reset">Сбросить PIN и удалить данные</button><button type="button" class="btn ghost sm" data-k="noreset">Назад</button></div>':'<button type="button" class="chip" data-k="forgot">Забыли PIN?</button>';
  }
  $lock.innerHTML=h;
}
function lockDone(){
  var pin=L.buf;
  if(L.mode==="unlock"||L.mode==="off"){
    if(hashPin(pin)===db.settings.pin){if(L.mode==="off"){db.settings.pin="";save();toast("PIN-код отключён");hideLock();render(true)}else hideLock()}
    else{L.buf="";L.msg="Неверный PIN-код";renderLock();try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}}
  }else if(L.mode==="set1"){L.first=pin;L.buf="";L.mode="set2";L.msg="";renderLock()}
  else if(L.mode==="set2"){
    if(pin===L.first){db.settings.pin=hashPin(pin);save();toast("PIN-код включён");hideLock();render(true)}
    else{L.mode="set1";L.buf="";L.first="";L.msg="Коды не совпали, попробуйте ещё раз";renderLock()}
  }
}
$lock.addEventListener("click",function(e){
  var b=e.target.closest("[data-k]");if(!b)return;var k=b.getAttribute("data-k");
  if(/^\d$/.test(k)){if(L.buf.length<4){L.buf+=k;L.msg="";renderLock();if(L.buf.length===4)setTimeout(lockDone,120)}}
  else if(k==="b"){L.buf=L.buf.slice(0,-1);renderLock()}
  else if(k==="x"){if(L.mode!=="unlock"){hideLock()}}
  else if(k==="forgot"){L.forgot=true;renderLock()}
  else if(k==="noreset"){L.forgot=false;renderLock()}
  else if(k==="reset"){db.records=[];db.settings.pin="";save();hideLock();toast("PIN сброшен, записи удалены");render()}
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(db.settings.pin&&hiddenAt&&Date.now()-hiddenAt>15000&&$lock.hidden)showLock("unlock");
  checkReminders();if(S.tab==="today"&&$lock.hidden)render(true);
});

function demoData(){
  var seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  var out=[],now=new Date(),slots=[[7,20,"Завтрак",50],[12,40,"Обед",65],[16,30,"Перекус",25],[19,30,"Ужин",60],[22,30,"",0]];
  for(var d=13;d>=0;d--){slots.forEach(function(sl,i){
    var t=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d,sl[0],sl[1]+Math.floor(rnd()*10)).getTime();if(t>Date.now())return;
    var g=Math.round((4.6+rnd()*5.4+(i===1||i===3?1.3:0)-(rnd()<.06?2:0))*10)/10;
    var rec={id:uid()+i+d,t:t,g:Math.max(2.8,g),ins:null,insL:null,c:null,meal:sl[2],note:"",demo:true};
    if(sl[3]){rec.c=Math.round(sl[3]*(.85+rnd()*.3));rec.ins=Math.round(rec.c/10*2)/2}
    if(i===4){rec.insL=14}
    if(rec.ins!=null)rec.site=SITES[(d*5+i)%SITES.length];
    if(i===2&&d%3===0){rec.act=30;rec.tags=["Спорт"]}
    if(i===3&&d===5){rec.tags=["Стресс"]}
    if(i===0&&d%7===0)rec.wt=Math.round((72-d*.05)*10)/10;
    if(i===0&&d===10)rec.a1c=6.9;
    out.push(rec)})}
  return out;
}
function importDb(text){
  try{var p=JSON.parse(text);if(!p||!Array.isArray(p.records))throw 0;
    var have={};db.records.forEach(function(r){have[r.id]=1});var add=0;
    p.records.forEach(function(r){if(r&&r.id&&isFinite(r.t)&&!have[r.id]){db.records.push(r);add++}});migrate(db.records);
    if(p.settings){var ps=p.settings;delete ps.pin;delete ps.aiKey;if(!db.settings.name)db.settings=Object.assign(db.settings,ps)}
    save();S.importMsg="Восстановлено записей: "+add+".";
  }catch(e){S.importMsg="Не удалось прочитать копию. Проверьте, что вставлен весь текст."}
  render(true);
}
function quickSave(){
  var el=document.getElementById("q-g");if(!el)return;var v=parseNum(el.value);
  if(v==null){toast("Введите число, например "+(isMg()?"120":"6.5"));return}
  var ge=glucoseErr(v);if(ge){toast(ge);return}
  db.records.push({id:uid(),t:Date.now(),g:toMmol(v),ins:null,insL:null,c:null,meal:"",note:""});save();
  toast(v&&toMmol(v)<db.settings.low?"Сохранено. Сахар ниже цели, действуйте по рекомендациям врача.":"Сохранено");render(true);
}

  }).then(function(){if(S.tab==="more")render(true)});
}
function syncNative(askPerm){
  if(!isNative())return Promise.resolve();
  var p=askPerm?nat("LocalNotifications","requestPermissions"):nat("LocalNotifications","checkPermissions");
  return p.then(function(r){
    S.notif=r.display;S.nativeOk=true;
    if(r.display!=="granted"){if(askPerm)toast("Разрешите уведомления для DiaCare в настройках телефона");return}
    return nat("LocalNotifications","createChannel",{id:CH,name:"Напоминания об измерении",description:"Напоминания измерить сахар",importance:5,visibility:1,vibration:true,lights:true}).catch(function(){}).then(function(){
      return nat("LocalNotifications","getPending")}).then(function(pe){
      return pe&&pe.notifications&&pe.notifications.length?nat("LocalNotifications","cancel",{notifications:pe.notifications.map(function(n){return{id:n.id}})}):null}).then(function(){
      var list=db.settings.reminders.filter(function(x){return x.on}).map(function(x,i){var hm=x.time.split(":").map(Number);return{id:1000+i,title:"DiaCare",body:x.label||"Пора измерить сахар",channelId:CH,schedule:{on:{hour:hm[0],minute:hm[1]},allowWhileIdle:true}}});
      (db.settings.oneoff||[]).forEach(function(o){if(o.at>Date.now())list.push({id:o.nid,title:"DiaCare",body:o.label,channelId:CH,schedule:{at:new Date(o.at).toISOString(),allowWhileIdle:true}})});
      return list.length?nat("LocalNotifications","schedule",{notifications:list}):null});
  }).catch(function(e){
    S.nativeOk=false;if(askPerm)toast("Уведомления не настроены: "+errMsg(e).slice(0,80));
  }).then(function(){if(S.tab==="more")render(true)});
}
function testNotif(){
  var at=Date.now()+5000;
  if(!isNative()||!S.nativeOk){setTimeout(function(){S.alerts.push({time:timeStr(Date.now()),label:"Тест: так выглядит напоминание"});beep();try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(x){}render(true)},5000);toast("Тест через 5 секунд, пока страница открыта");return}
  nat("LocalNotifications","requestPermissions").then(function(r){
    if(r.display!=="granted"){toast("Сначала разрешите уведомления в настройках телефона");return}
    return nat("LocalNotifications","createChannel",{id:CH,name:"Напоминания об измерении",description:"Напоминания измерить сахар",importance:5,visibility:1,vibration:true,lights:true}).catch(function(){}).then(function(){
      return nat("LocalNotifications","schedule",{notifications:[{id:9999,title:"DiaCare",body:"Тест: так выглядит напоминание",channelId:CH,schedule:{at:new Date(at).toISOString(),allowWhileIdle:true}}]})}).then(function(){toast("Уведомление придёт через 5 секунд. Можно свернуть приложение.")});
  }).catch(function(e){toast("Не получилось: "+errMsg(e).slice(0,80))});
}

$app.addEventListener("input",function(e){if(e.target.id==="s-hue"){db.settings.hue=+e.target.value;db.settings.accent="custom";applyAccent();return}var k=e.target.getAttribute("data-f");if(k&&S.form)S.form[k]=e.target.value;if(e.target.getAttribute("data-ai")==="text")AI().text=e.target.value});
$app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="q-g"){e.preventDefault();quickSave()}});
$app.addEventListener("toggle",function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-sec");if(id)S.open[id]=e.target.open},true);
$app.addEventListener("change",function(e){
  var el=e.target,k=el.getAttribute("data-s");
  if(k){
    if(k==="low"||k==="high"){
      var v=parseNum(el.value),nl=k==="low"?(v==null?null:toMmol(v)):db.settings.low,nh=k==="high"?(v==null?null:toMmol(v)):db.settings.high;
      if(nl==null||nh==null||nl>=nh||nl<1||nh>30){S.setErr="Проверьте диапазон: «от» должно быть меньше «до».";render(true);return}
      db.settings.low=nl;db.settings.high=nh;S.setErr="";save();render(true);return;
    }
    if(k==="xeG"){var x=parseNum(el.value);if(x==null||x<5||x>30){S.setErr="В одной ХЕ обычно 10–12 г. Допустимо от 5 до 30.";render(true);return}db.settings.xeG=x;S.setErr="";save();render(true);return}
    db.settings[k]=el.value.trim();save();if(k==="email")render(true);return;
  }
  if(el.id==="s-hue"){db.settings.hue=+el.value;db.settings.accent="custom";save();render(true);return}
  var gi=el.getAttribute("data-ai-g");
  if(gi!=null&&AI().res){var it=AI().res.items[+gi],ng=parseNum(el.value);
    if(it&&ng!=null&&ng>=0&&ng<=5000&&it.base.g>0){var kk=ng/it.base.g;it.grams=ng;it.carbs=r1(it.base.c*kk);it.protein=r1(it.base.p*kk);it.fat=r1(it.base.f*kk);retotal(AI().res)}
    render(true);return}
  var sid=el.getAttribute("data-sup");
  if(sid){var nv=parseNum(el.value);db.settings.supplies.forEach(function(x){if(x.id===sid)x.n=Math.max(0,Math.round(nv==null?x.n:nv))});save();render(true);return}
  if(el.id==="ai-file"&&el.files&&el.files[0]){downscale(el.files[0]).then(function(d){AI().img=d;AI().err="";AI().res=null;render(true)},function(){AI().err="Не удалось открыть фото.";render(true)});return}
  if(el.id==="bk-file"&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){importDb(String(fr.result))};fr.readAsText(el.files[0])}
});
$app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),v=b.getAttribute("data-v"),id=b.getAttribute("data-id"),f=S.form,enc=new TextEncoder();
  switch(a){
    case"tab":go(v);break;
    case"quick":f.g=v;render(true);break;
    case"quick-save":quickSave();break;
    case"site":f.site=f.site===v?"":v;render(true);break;
    case"tag":var ti=f.tags.indexOf(v);if(ti>=0)f.tags.splice(ti,1);else f.tags.push(v);render(true);break;
    case"remind":f.remind=+v;render(true);break;
    case"notif-allow":syncNative(true);break;
    case"notif-exact":nat("LocalNotifications","changeExactNotificationSetting").then(function(){return refreshNotif()}).catch(function(){toast("Откройте настройки телефона: Приложения, DiaCare, Будильники и напоминания")});break;
    case"notif-test":testNotif();break;
    case"remind15":addOneOff(15,"Перепроверьте сахар");break;
    case"goto-sup":go("more");S.sub="sup";render();break;
    case"sub":S.sub=v;render();window.scrollTo(0,0);break;
    case"sub-back":S.sub=null;render();window.scrollTo(0,0);break;
    case"step":var kk=b.getAttribute("data-k"),cv=parseNum(f[kk]);if(cv==null)cv=0;cv=Math.max(0,cv+(+v)*(kk==="c"&&xeMode()?.5:1));f[kk]=cv?String(Math.round(cv*10)/10):"";render(true);break;
    case"gstep":var gv=parseNum(f.g);if(gv==null)gv=isMg()?100:6;gv=Math.max(0,gv+(+v)*(isMg()?5:.1));f.g=isMg()?String(Math.round(gv)):gv.toFixed(1);render(true);break;
    case"sup-preset":document.getElementById("sup-name").value=v;break;
    case"sup-add":
      var sn=document.getElementById("sup-name").value.trim(),sc=parseNum(document.getElementById("sup-n").value),sw=parseNum(document.getElementById("sup-w").value);
      if(!sn){toast("Введите название");break}
      db.settings.supplies.push({id:uid(),name:sn,n:Math.max(0,Math.round(sc==null?0:sc)),w:Math.max(0,Math.round(sw==null?10:sw))});save();render(true);break;
    case"sup-dec":db.settings.supplies.forEach(function(x){if(x.id===id&&x.n>0)x.n--});save();render(true);break;
    case"sup-del":db.settings.supplies=db.settings.supplies.filter(function(x){return x.id!==id});save();render(true);break;
    case"meal":f.meal=f.meal===v?"":v;render(true);break;
    case"save":
      var r=saveForm();if(!r){render(true);window.scrollTo(0,0);break}
      if(f.remind)addOneOff(f.remind,"Проверьте сахар",true);
      S.form=null;toast(r.g!=null&&r.g<db.settings.low?"Сохранено. Сахар ниже цели, действуйте по рекомендациям врача.":"Запись сохранена");
      go("today");break;
    case"edit":var rec=db.records.find(function(x){return x.id===id});if(rec){S.form=formFrom(rec);S.tab="add";S.confirm=null;render();window.scrollTo(0,0)}break;
    case"cancel-edit":S.form=null;go("history");break;
    case"del":S.confirm="del";render(true);break;
    case"del-yes":db.records=db.records.filter(function(x){return x.id!==f.id});save();S.form=null;toast("Запись удалена");go("history");break;
    case"cancel":S.confirm=null;render(true);break;
    case"hist":S.histDays=+v;render(true);break;
    case"cdays":S.chartDays=+v;render(true);break;
    case"bar":S.barKind=v;render(true);break;
    case"rdays":S.repDays=+v;S.repMsg="";render(true);break;
    case"unit":db.settings.unit=v;S.setErr="";save();render(true);break;
    case"cunit":db.settings.carbUnit=v;S.setErr="";save();if(S.form)S.form=null;render(true);break;
    case"accent":db.settings.accent=v;save();render(true);break;
    case"theme":db.settings.theme=v;save();render(true);break;
    case"mail":S.repMsg="";S.manual=null;mailSend();break;
    case"man-sel":var ta=document.getElementById("man-ta");if(ta){ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length)}break;
    case"man-close":S.manual=null;render(true);break;
    case"ai-run":aiRun();break;
    case"ai-local":aiLocal();break;
    case"ai-ex":(function(){var a=AI();a.text=(a.text.trim()?a.text.replace(/[,\s]+$/,"")+", ":"")+v;render(true)})();break;
    case"ai-step":(function(){var r=AI().res,it=r&&r.items[+id];if(!it||!it.base.g)return;var stp=it.grams<60?5:10,ng=Math.max(5,Math.round(it.grams+(+v)*stp)),kk=ng/it.base.g;
      it.grams=ng;it.carbs=r1(it.base.c*kk);it.protein=r1(it.base.p*kk);it.fat=r1(it.base.f*kk);retotal(r);render(true)})();break;
    case"food-add":(function(){var nm=document.getElementById("mf-name").value.trim(),c=parseNum(document.getElementById("mf-c").value),p=parseNum(document.getElementById("mf-p").value),ft=parseNum(document.getElementById("mf-f").value);
      if(!nm){toast("Введите название");return}if(c==null&&p==null&&ft==null){toast("Укажите хотя бы одно значение на 100 г");return}
      if(!db.settings.foods)db.settings.foods=[];db.settings.foods.unshift({id:uid(),name:nm.slice(0,40),c:c||0,p:p||0,f:ft||0});save();toast("Добавлено");render(true)})();break;
    case"food-del":db.settings.foods=(db.settings.foods||[]).filter(function(x){return x.id!==id});save();render(true);break;
    case"ai-apply":aiApply();break;
    case"ai-noimg":AI().img="";render(true);break;
    case"aiprov":db.settings.aiProv=v;db.settings.aiModel="";save();render(true);break;
    case"copy-report":copyText(reportText(S.repDays,false),"Отчёт скопирован");break;
    case"pdf":
      try{var bytes=makePdf(reportPages(S.repDays));deliver("diacare-"+dayKey(Date.now())+".pdf","application/pdf",bytes,"DiaCare, отчёт","","rep")}catch(x){S.repMsg="Не удалось собрать PDF. Используйте «Копировать».";render(true)}
      break;
    case"csv":deliver("diacare-"+dayKey(Date.now())+".csv","text/csv",enc.encode(csvText(S.repDays)),"DiaCare, таблица","","rep",csvText(S.repDays));break;
    case"rem-add":
      var tm=document.getElementById("rem-time").value,lb=document.getElementById("rem-label").value.trim();
      if(!tm){toast("Укажите время");break}
      db.settings.reminders.push({id:uid(),time:tm,label:lb,on:true,last:""});save();
      if(!isNative()&&window.Notification&&Notification.permission==="default"){try{Notification.requestPermission()}catch(x){}}
      syncNative(true);render(true);break;
    case"rem-tog":db.settings.reminders.forEach(function(r){if(r.id===id)r.on=!r.on});save();syncNative(true);render(true);break;
    case"rem-del":db.settings.reminders=db.settings.reminders.filter(function(r){return r.id!==id});save();syncNative(false);render(true);break;
    case"pin-tog":showLock(db.settings.pin?"off":"set1");break;
    case"bk-copy":copyText(exportDb(),"Копия скопирована. Вставьте её в заметку или письмо себе.","bk");break;
    case"bk-file":deliver("diacare-backup-"+dayKey(Date.now())+".json","application/json",enc.encode(exportDb()),"DiaCare, резервная копия","","bk",exportDb());break;
    case"bk-paste":importDb(document.getElementById("bk-in").value);break;
    case"clear":S.confirm="clear";render(true);break;
    case"clear-yes":db.records=[];save();S.confirm=null;toast("Записи удалены");render(true);break;
    case"demo":db.records=db.records.concat(demoData());save();go("today");break;
    case"rm-demo":db.records=db.records.filter(function(r){return!r.demo});save();render(true);break;
    case"alert-x":S.alerts.splice(+b.getAttribute("data-i"),1);render(true);break;
    case"alert-add":S.alerts.splice(+b.getAttribute("data-i"),1);S.form=newForm();go("add");break;
  }
});
$nav.addEventListener("click",function(e){var b=e.target.closest("[data-act='tab']");if(b)go(b.getAttribute("data-v"))});

/* напоминания внутри страницы (для браузера) */
function notify(label){
  beep();
  try{if(window.Notification&&Notification.permission==="granted")new Notification("DiaCare",{body:label})}catch(x){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(x){}
}
function checkReminders(){
  var nt=Date.now(),native=isNative()&&S.nativeOk,fired=false,changed=false,keep=[];
  (db.settings.oneoff||[]).forEach(function(o){
    if(o.at<=nt){changed=true;if(!native&&nt-o.at<6*36e5){fired=true;S.alerts.push({time:timeStr(o.at),label:o.label});notify(o.label)}}else keep.push(o)});
  if(changed)db.settings.oneoff=keep;
  if(native){if(changed)save();return}
  var now=new Date(),hm=pad(now.getHours())+":"+pad(now.getMinutes()),dk=dayKey(now.getTime());
  (db.settings.reminders||[]).forEach(function(r){
    if(r.on&&r.time===hm&&r.last!==dk){r.last=dk;fired=true;changed=true;S.alerts.push({time:r.time,label:r.label||"Пора измерить сахар"});notify(r.label||"Пора измерить сахар")}});
  if(changed)save();
  if(fired)render(true);
}
setInterval(checkReminders,15000);

render();
if(db.settings.pin)showLock("unlock");
setTimeout(function(){syncNative(false).then(refreshNotif)},1500);
})();
